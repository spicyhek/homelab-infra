config:
  modules:
    dns_brendanmanley_a:
      dns:
        preferred_ip_protocol: ip4
        query_name: brendanmanley.com
        query_type: A
        transport_protocol: udp
        valid_rcodes:
        - NOERROR
      prober: dns
      timeout: 5s
    dns_grafana_a:
      dns:
        preferred_ip_protocol: ip4
        query_name: grafana.brendanmanley.com
        query_type: A
        transport_protocol: udp
        valid_rcodes:
        - NOERROR
      prober: dns
      timeout: 5s
    dns_nids_a:
      dns:
        preferred_ip_protocol: ip4
        query_name: nids.brendanmanley.com
        query_type: A
        transport_protocol: udp
        valid_rcodes:
        - NOERROR
      prober: dns
      timeout: 5s
    dns_status_a:
      dns:
        preferred_ip_protocol: ip4
        query_name: status.brendanmanley.com
        query_type: A
        transport_protocol: udp
        valid_rcodes:
        - NOERROR
      prober: dns
      timeout: 5s
    http_2xx:
      http:
        follow_redirects: true
        preferred_ip_protocol: ip4
        valid_http_versions:
        - HTTP/1.1
        - HTTP/2.0
      prober: http
      timeout: 5s
