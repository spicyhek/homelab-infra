# Managed by homelab-infra: host/control-plane
[Unit]
Wants=homelab-network-guard.timer
After=systemd-networkd.service

[Service]
# A failed preflight is retried by the existing K3s Restart=always policy.
# Do not bind K3s lifetime to the NIC: a flap should not stop the running API.
ExecStartPre=/usr/bin/python3 /usr/local/libexec/homelab-network-guard.py wait-online --timeout 120
