name: Kubernetes

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - ".github/workflows/kubernetes.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: kubernetes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CRD_CATALOG_REVISION: 63669a570e231d4f1f8396d229a1de512bcf0a34
  KUBECONFORM_VERSION: 0.8.0
  KUBERNETES_VERSION: 1.36.4
  KUSTOMIZE_VERSION: 5.8.3
  YAMLLINT_VERSION: 1.38.0

jobs:
  changes:
    name: Detect Kubernetes changes
    runs-on: ubuntu-latest
    outputs:
      kubernetes: ${{ steps.filter.outputs.result }}

    steps:
      - name: Detect relevant files
        id: filter
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            if (context.eventName === "push") {
              return "true";
            }

            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              },
            );

            if (files.length !== context.payload.pull_request.changed_files) {
              throw new Error("GitHub returned an incomplete pull-request file list");
            }

            const changed = files.some(({ filename, previous_filename: previousFilename }) =>
              [filename, previousFilename].filter(Boolean).some((path) =>
                path.startsWith("k8s/") ||
                path === ".github/workflows/kubernetes.yml"
              )
            );

            return changed ? "true" : "false";

  yaml-lint:
    name: YAML lint
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install yamllint
        run: python -m pip install "yamllint==${YAMLLINT_VERSION}"

      - name: Lint YAML
        run: yamllint --config-file k8s/.yamllint.yml k8s .github/workflows/kubernetes.yml

  validate-workload:
    name: Validate ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cloudflared
            path: k8s/edge/cloudflared
          - name: nids
            path: k8s/apps/nids
          - name: nids-backup
            path: k8s/backups
          - name: personal-site
            path: k8s/apps/personal-site
          - name: status-api
            path: k8s/apps/status-api
          - name: zeek
            path: k8s/daemonsets/zeek

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Kustomize
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            --output "${RUNNER_TEMP}/kustomize.tar.gz"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/kustomize.tar.gz" \
            --directory "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/kustomize"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Install Kubeconform
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/kubeconform.tar.gz"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/kubeconform.tar.gz" \
            --directory "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/kubeconform"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Render manifests
        shell: bash
        run: kustomize build "${{ matrix.path }}" > "${RUNNER_TEMP}/${{ matrix.name }}.yml"

      - name: Validate manifests
        shell: bash
        run: |
          kubeconform \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -strict \
            -summary \
            "${RUNNER_TEMP}/${{ matrix.name }}.yml"

  validate-argocd:
    name: Validate Argo CD applications
    needs: changes
    if: needs.changes.outputs.kubernetes == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Kubeconform
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/kubeconform.tar.gz"
          tar --extract --gzip \
            --file "${RUNNER_TEMP}/kubeconform.tar.gz" \
            --directory "${RUNNER_TEMP}"
          chmod +x "${RUNNER_TEMP}/kubeconform"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Validate Argo CD applications
        shell: bash
        run: |
          kubeconform \
            -kubernetes-version "${KUBERNETES_VERSION}" \
            -schema-location default \
            -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/${CRD_CATALOG_REVISION}/argoproj.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -strict \
            -summary \
            k8s/argocd/homelab-apps.yml \
            k8s/argocd/applications

  required:
    name: Kubernetes required
    needs:
      - changes
      - yaml-lint
      - validate-workload
      - validate-argocd
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Confirm required Kubernetes checks passed
        env:
          ARGOCD_RESULT: ${{ needs.validate-argocd.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          KUBERNETES_CHANGED: ${{ needs.changes.outputs.kubernetes }}
          LINT_RESULT: ${{ needs.yaml-lint.result }}
          WORKLOAD_RESULT: ${{ needs.validate-workload.result }}
        shell: bash
        run: |
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "Kubernetes change detection failed" >&2
            exit 1
          fi

          if [[ "${KUBERNETES_CHANGED}" == "true" ]]; then
            if [[ "${LINT_RESULT}" != "success" || \
                  "${WORKLOAD_RESULT}" != "success" || \
                  "${ARGOCD_RESULT}" != "success" ]]; then
              echo "Kubernetes validation must pass" >&2
              exit 1
            fi
          fi
