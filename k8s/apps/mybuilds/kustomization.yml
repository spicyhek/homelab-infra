apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deploy.yml
  - rbac.yml

# The hash suffix restarts the pod when the Litestream config changes.
configMapGenerator:
  - name: mybuilds-litestream
    namespace: default
    files:
      - litestream.yml

images:
  - name: ghcr.io/spicyhek/mybuilds
    digest: sha256:b05a444f85a68a67429c4d34272fcf13df819a2f86731ec9a973d4e7e4d9732c

patches:
  - path: release-patch.yml
