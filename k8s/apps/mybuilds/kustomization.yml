apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deploy.yml
  - rbac.yml

# The hash suffix restarts the pod when the Litestream config changes.
configMapGenerator:
  - name: mybuilds-litestream
    namespace: default
    files:
      - litestream.yml

images:
  - name: ghcr.io/spicyhek/mybuilds
    digest: sha256:c37b79e0ba0c8f8a7b47ec1a6cb7ba6d4d0465f651591c757e0477cfea9f5380

patches:
  - path: release-patch.yml
