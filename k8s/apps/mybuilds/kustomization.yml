apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deploy.yml
  - rbac.yml

# The hash suffix restarts the pod when the Litestream config changes.
configMapGenerator:
  - name: mybuilds-litestream
    namespace: default
    files:
      - litestream.yml

images:
  - name: ghcr.io/spicyhek/mybuilds
    digest: sha256:8da69ba7bd0abad83bb83784ecb3df82dd7c2d6ed9500ba1c9d8fadbf91b76ef

patches:
  - path: release-patch.yml
