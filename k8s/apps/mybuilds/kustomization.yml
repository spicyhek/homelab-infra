apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deploy.yml
  - rbac.yml

# The hash suffix restarts the pod when the Litestream config changes.
configMapGenerator:
  - name: mybuilds-litestream
    namespace: default
    files:
      - litestream.yml

images:
  - name: ghcr.io/spicyhek/mybuilds
    digest: sha256:59b10dcc0b824f0a124fd0fb2b66cb4576fe9b449a449c7b5c8a3f16967b61f2

patches:
  - path: release-patch.yml
