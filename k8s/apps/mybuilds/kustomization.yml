apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deploy.yml
  - rbac.yml

# The hash suffix restarts the pod when the Litestream config changes.
configMapGenerator:
  - name: mybuilds-litestream
    namespace: default
    files:
      - litestream.yml

images:
  - name: ghcr.io/spicyhek/mybuilds
    digest: sha256:bab843c3df13ace876b8d7c2f0b2b5354ca4f23cb91d06eb45a6ee6afd366e0e

patches:
  - path: release-patch.yml
