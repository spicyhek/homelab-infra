apiVersion: v1
kind: ConfigMap
metadata:
  name: nids-config
  namespace: default
data:
  PORT: "8080"
  NIDS_DB_PATH: /data/nids.sqlite3
  NIDS_MODEL_PATH: /app/cicids2018_dense_model.keras
  NIDS_SCALER_PATH: /app/scaler.joblib
  NIDS_FEATURE_ORDER_PATH: /app/feature_order.json
  NIDS_LABEL_MAP_PATH: /app/label_map.json
  NIDS_LABEL_ENCODER_PATH: /app/label_encoder.joblib
  NIDS_PUBLIC_WINDOW_MINUTES: "60"
  NIDS_MAX_HISTORY_HOURS: "672"
  NIDS_RETENTION_HOURS: "672"
  NIDS_DEFAULT_SOURCE_NAME: homelab-flow-bridge
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nids-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nids
  namespace: default
spec:
  replicas: 1 # Keep one steady-state writer for SQLite
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: nids
  template:
    metadata:
      labels:
        app: nids
    spec:
      nodeSelector:
        kubernetes.io/hostname: homelab-control-plane
      containers:
        - name: web
          image: ghcr.io/spicyhek/mynids
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nids-config
          env:
            - name: NIDS_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nids-secrets
                  key: NIDS_INGEST_TOKEN
            # Operational model: the zeek-conn-window-v2 tree (nids-v6-tree-baseline-v2; passed the
            # reserved final test 2026-11-05, the live parity re-check 2026-11-07 and 3 days of shadow;
            # the operator waived the rest of the planned week of shadow).
            # It labels flows with a warm, undegraded window. The built-in Keras model labels the rest
            # (cold windows after restarts, flows without v2 features) and runs in shadow on the flows
            # v2 labeled. If the bundle fails to load or run, flows get the Keras label and /healthz is
            # degraded, but /readyz stays ready so ingestion continues.
            # The app unpickles the bundle only if tree_model.joblib matches this SHA-256.
            # Roll back by setting NIDS_OPERATIONAL_MODEL to keras (v2 returns to shadow).
            - name: NIDS_OPERATIONAL_MODEL
              value: v2
            - name: NIDS_V2_MODEL_DIR
              value: /models/nids-v6-tree-baseline-v2
            - name: NIDS_V2_MODEL_SHA256
              value: e0c5b9fd21a3c19880e53eb9694d6f475e6df5f1731318fd96c2b010b6ac6ba8
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 160
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: nids-data
              mountPath: /data
            - name: nids-models
              mountPath: /models
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
      volumes:
        - name: nids-data
          persistentVolumeClaim:
            claimName: nids-data
        # Private model bundles staged by the operator on homelab-control-plane (the pod is pinned
        # there). They stay out of the public image, a ConfigMap (the bundle is ~1.8 MB) and the DB
        # volume. type Directory means a missing stage blocks the new pod, while maxUnavailable: 0
        # keeps the old pod serving. See docs/nids-shadow-model.md.
        - name: nids-models
          hostPath:
            path: /var/lib/mynids-models
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: nids
  namespace: default
spec:
  selector:
    app: nids
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP
