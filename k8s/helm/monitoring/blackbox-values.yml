config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions:
          - HTTP/1.1
          - HTTP/2.0
        follow_redirects: true
        preferred_ip_protocol: ip4

    dns_brendanmanley_a:
      prober: dns
      timeout: 5s
      dns:
        transport_protocol: udp
        preferred_ip_protocol: ip4
        query_name: brendanmanley.com
        query_type: A
        valid_rcodes:
          - NOERROR

    dns_grafana_a:
      prober: dns
      timeout: 5s
      dns:
        transport_protocol: udp
        preferred_ip_protocol: ip4
        query_name: grafana.brendanmanley.com
        query_type: A
        valid_rcodes:
          - NOERROR

    dns_status_a:
      prober: dns
      timeout: 5s
      dns:
        transport_protocol: udp
        preferred_ip_protocol: ip4
        query_name: status.brendanmanley.com
        query_type: A
        valid_rcodes:
          - NOERROR

    dns_nids_a:
      prober: dns
      timeout: 5s
      dns:
        transport_protocol: udp
        preferred_ip_protocol: ip4
        query_name: nids.brendanmanley.com
        query_type: A
        valid_rcodes:
          - NOERROR
