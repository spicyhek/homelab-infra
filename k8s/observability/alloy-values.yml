fullnameOverride: alloy

global:
  podSecurityContext:
    fsGroup: 473

crds:
  create: false

alloy:
  configMap:
    create: false
    name: alloy-config
    key: config.alloy
  enableReporting: false
  envFrom:
    - secretRef:
        name: grafana-cloud-metrics
  mounts:
    extra:
      - name: storage
        mountPath: /tmp/alloy
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsGroup: 473
    runAsUser: 473
    seccompProfile:
      type: RuntimeDefault

configReloader:
  resources:
    requests:
      cpu: 5m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

controller:
  type: deployment
  replicas: 1
  nodeSelector:
    observability: heavy
  volumes:
    extra:
      - name: storage
        emptyDir: {}

rbac:
  create: true
  namespaces:
    - monitoring
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list
        - watch

service:
  enabled: false

serviceMonitor:
  enabled: false

ingress:
  enabled: false
