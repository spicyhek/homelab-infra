apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: personal-site
  namespace: argocd
  # Sync and health evidence for mybuilds (k8s/argocd/notifications).
  annotations:
    notifications.argoproj.io/subscribe.mybuilds-on-sync-running.mybuilds: ""
    notifications.argoproj.io/subscribe.mybuilds-on-sync-succeeded.mybuilds: ""
    notifications.argoproj.io/subscribe.mybuilds-on-sync-failed.mybuilds: ""
    notifications.argoproj.io/subscribe.mybuilds-on-health-degraded.mybuilds: ""
spec:
  project: default
  source:
    repoURL: https://github.com/spicyhek/homelab-infra.git
    targetRevision: main
    path: k8s/apps/personal-site
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
