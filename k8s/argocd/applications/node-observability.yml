apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-observability
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-node-exporter
      targetRevision: 4.59.0
      helm:
        releaseName: node-exporter
        valueFiles:
          - $values/k8s/observability/node-exporter-values.yml
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.1
      helm:
        releaseName: alloy
        valueFiles:
          - $values/k8s/observability/alloy-values.yml
    - repoURL: https://github.com/spicyhek/homelab-infra.git
      targetRevision: main
      ref: values
      path: k8s/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
