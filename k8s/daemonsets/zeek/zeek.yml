apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zeek
  namespace: default
spec:
  selector:
    matchLabels:
      app: zeek
  template:
    metadata:
      labels:
        app: zeek
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: homelab-control-plane
      containers:
        - name: zeek
          image: zeek/zeek@sha256:524cb0ce29f26a6a954fb9c357a8f92b95812476d8240f0ece26617ace249dd0
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          command:
            - /usr/local/zeek/bin/zeek
          args:
            - -i
            - eth0
            - -C
            - local
          volumeMounts:
            - name: zeek-local-policy
              mountPath: /usr/local/zeek/share/zeek/site/local.zeek
              subPath: local.zeek
              readOnly: true
            - name: zeek-logs
              mountPath: /zeek-logs

        - name: zeek-converter
          image: ghcr.io/spicyhek/mynids:sha-bad602b68ac9f373c9f6377a6240d5475eeb9821
          imagePullPolicy: Always
          command:
            - python
            - sensor/zeek_to_cicids.py
          args:
            - --log-path
            - /zeek-logs/conn.log
            - --endpoint
            - http://nids.default.svc.cluster.local/api/internal/flows
            - --state-file
            - /var/lib/mynids/zeek-forwarder-state.json
            - --source-prefix
            - zeek-worker
            - --poll-seconds
            - "5"
            - --batch-size
            - "100"
          env:
            - name: NIDS_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nids-secrets
                  key: NIDS_INGEST_TOKEN
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: zeek-logs
              mountPath: /zeek-logs
            - name: zeek-state
              mountPath: /var/lib/mynids

      volumes:
        - name: zeek-local-policy
          configMap:
            name: zeek-local-policy
        - name: zeek-logs
          hostPath:
            path: /var/lib/zeek-logs
            type: DirectoryOrCreate
        - name: zeek-state
          hostPath:
            path: /var/lib/mynids-zeek
            type: DirectoryOrCreate
