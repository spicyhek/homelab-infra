apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zeek
  namespace: default
spec:
  selector:
    matchLabels:
      app: zeek
  template:
    metadata:
      labels:
        app: zeek
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: homelab-control-plane
      containers:
        - name: zeek
          image: zeek/zeek@sha256:524cb0ce29f26a6a954fb9c357a8f92b95812476d8240f0ece26617ace249dd0
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          command:
            - /usr/local/zeek/bin/zeek
          args:
            - -i
            - eth0
            - -C
            - local
          volumeMounts:
            - name: zeek-local-policy
              mountPath: /usr/local/zeek/share/zeek/site/local.zeek
              subPath: local.zeek
              readOnly: true
            - name: zeek-logs
              mountPath: /zeek-logs

        - name: zeek-converter
          image: ghcr.io/spicyhek/mynids:sha-bad602b68ac9f373c9f6377a6240d5475eeb9821
          imagePullPolicy: Always
          command:
            - python
            - sensor/zeek_to_cicids.py
          args:
            - --log-path
            - /zeek-logs/conn.log
            - --endpoint
            - http://nids.default.svc.cluster.local/api/internal/flows
            - --state-file
            - /var/lib/mynids/zeek-forwarder-state.json
            - --source-prefix
            - zeek-worker
            - --poll-seconds
            - "5"
            - --batch-size
            - "100"
          env:
            - name: NIDS_INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nids-secrets
                  key: NIDS_INGEST_TOKEN
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: zeek-logs
              mountPath: /zeek-logs
            - name: zeek-state
              mountPath: /var/lib/mynids

        # Zeek rotates logs hourly but never deletes them; they share the USB NVMe with etcd.
        # Only timestamped rotations older than 14 days are removed (about 1.6 GB is kept).
        # The live *.log files and the current/ directory are never touched, and the converter
        # only rereads the latest rotated conn log, so it never loses unread lines.
        - name: zeek-log-retention
          image: zeek/zeek@sha256:524cb0ce29f26a6a954fb9c357a8f92b95812476d8240f0ece26617ace249dd0
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                find /zeek-logs -maxdepth 1 -type f \
                  -name '*.[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[0-9][0-9].log' \
                  -mmin +20160 -print -delete | wc -l | sed 's/^/zeek-log-retention: deleted /'
                sleep 3600
              done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: zeek-logs
              mountPath: /zeek-logs

      volumes:
        - name: zeek-local-policy
          configMap:
            name: zeek-local-policy
        - name: zeek-logs
          hostPath:
            path: /var/lib/zeek-logs
            type: DirectoryOrCreate
        - name: zeek-state
          hostPath:
            path: /var/lib/mynids-zeek
            type: DirectoryOrCreate
